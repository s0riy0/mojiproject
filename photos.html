<body data-page="photos">

<div class="ambient" aria-hidden="true"></div>

<div class="app">
  <section class="stage" data-stage="photos">
    <div class="stage-head">
    </div>
    <div class="photo-grid" id="photoGrid">
      <div class="photo-track" id="photoTrack">
        <div class="photo-card">
          <div class="photo-glow"></div>
          <div class="photo-inner">
            <div class="photo-face photo-front">
              <img src="pic/love.jpg" alt="">
              <div class="photo-caption"></div>
            </div>
            <div class="photo-face photo-back">รอยยิ้มของเธอวันนั้น<br>ยังอยู่ในหัวฉันเลย</div>
          </div>
        </div>
        <div class="photo-card">
          <div class="photo-glow"></div>
          <div class="photo-inner">
            <div class="photo-face photo-front">
              <img src="pic/love2.jpg" alt="">
              <div class="photo-caption"></div>
            </div>
            <div class="photo-face photo-back">วันนั้นเราคุยกันยันดึก<br>แล้วก็ไม่เบื่อกันเลยสักครั้ง</div>
          </div>
        </div>
        <div class="photo-card">
          <div class="photo-glow"></div>
          <div class="photo-inner">
            <div class="photo-face photo-front">
              <img src="pic/love3.jpg" alt="">
              <div class="photo-caption"></div>
            </div>
            <div class="photo-face photo-back">ถ้าย้อนกลับไปได้<br>ฉันก็ยังอยากเจอเธออยู่ดี</div>
          </div>
        </div>
      </div>
    </div>
    <div class="photo-dots" id="photoDots"></div>
  </section>
</div>
